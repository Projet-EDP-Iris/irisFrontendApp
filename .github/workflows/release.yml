name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: --mac
            artifact_name: dmg-installer
            artifact_path: release/*.dmg

          - os: windows-latest
            build_args: --win
            artifact_name: exe-installer
            artifact_path: release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Align package.json version with the release tag
        # The committed package.json version is a manually-maintained dev
        # baseline, not bumped on every auto-tag.yml patch increment. This
        # makes the actual shipped build (installer metadata + the in-app
        # APP_VERSION, compiled from package.json at build time) match the
        # exact tag it was built from — done here in the ephemeral CI
        # checkout only, never committed back to the repo.
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build Vite app
        run: npm run build

      - name: Build Electron package
        # No CSC_IDENTITY_AUTO_DISCOVERY=false here on purpose: without a real
        # certificate configured, electron-builder falls back to a free ad-hoc
        # signature on macOS, which moves Gatekeeper's response from a hard
        # "app is damaged" block to a recoverable "unidentified developer"
        # warning (see issue #59). Full notarization still requires a paid
        # Apple Developer ID and isn't set up here.
        run: npx electron-builder ${{ matrix.build_args }} --publish=never

      - name: List release output
        shell: bash
        run: |
          ls -la release/ 2>/dev/null || echo "WARNING - release directory not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg-installer
          path: dmg-installer
        continue-on-error: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: exe-installer
          path: exe-installer
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dmg-installer/*
            exe-installer/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
