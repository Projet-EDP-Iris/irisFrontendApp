name: Auto Tag on Main Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Increment version
        id: new_version
        run: |
          LATEST_TAG=${{ steps.latest_tag.outputs.latest_tag }}
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create new tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.new_version.outputs.new_version }}
          message: "Auto-tag: ${{ steps.new_version.outputs.new_version }}"
          force_push_tag: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger the Release workflow for the new tag
        # A tag pushed using the default GITHUB_TOKEN does NOT fire other
        # workflows' `push: tags` triggers — GitHub blocks this on purpose to
        # prevent recursive workflow runs. This silently broke the auto-tag
        # -> release chain the moment auto-tag.yml switched from a personal
        # access token (GH_PAT) to GITHUB_TOKEN for the checkout step (fixing
        # an unrelated auth issue) — every tag since v1.1.5 was created but
        # never actually built/published. Explicitly dispatching release.yml
        # via the API is exempt from that restriction and needs no PAT.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref ${{ steps.new_version.outputs.new_version }}
